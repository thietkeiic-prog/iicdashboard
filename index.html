<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sổ doanh số</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#22303A; --ink-soft:#5B6670; --paper:#EFE6D2; --card:#F7F1E3;
    --red:#A63D2F; --line:#D8CBAA;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Be Vietnam Pro',sans-serif; padding:32px 20px;}
  .wrap{max-width:1100px; margin:0 auto;}
  .header{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:20px;}
  .kicker{display:flex; align-items:center; gap:8px; color:var(--red); font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;}
  h1{font-family:'Fraunces',serif; font-weight:600; font-size:30px; margin:4px 0;}
  .sub{color:var(--ink-soft); font-size:14px; margin:0;}
  .stamp{width:112px; height:112px; border-radius:50%; border:2px dashed var(--red); display:flex; flex-direction:column;
    align-items:center; justify-content:center; transform:rotate(-6deg); color:var(--red); background:var(--card); flex-shrink:0; text-align:center;}
  .stamp span:first-child{font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;}
  .stamp span:last-child{font-family:'IBM Plex Mono',monospace; font-size:14px; margin-top:4px; padding:0 6px;}

  .authbar{display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-bottom:16px; font-size:13px; color:var(--ink-soft);}
  .authbar input{font-family:'Be Vietnam Pro',sans-serif; font-size:12px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); width:150px;}
  .authbar button{font-family:'Be Vietnam Pro',sans-serif; font-size:12px; font-weight:600; padding:6px 12px; border-radius:6px; border:1px solid var(--ink); background:var(--ink); color:var(--card); cursor:pointer;}
  .authbar button.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .badge-live{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft);}
  .dot-live{width:7px; height:7px; border-radius:50%; background:#4C8B5A; display:inline-block;}

  .grid{display:grid; grid-template-columns:1.6fr 1fr; gap:20px;}
  @media(max-width:800px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--card); border:0.5px solid var(--line); border-radius:12px; padding:20px;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .tab{font-family:'Be Vietnam Pro',sans-serif; font-size:13px; font-weight:500; padding:6px 14px; border-radius:6px;
    border:1px solid var(--line); background:transparent; color:var(--ink-soft); cursor:pointer;}
  .tab.active{background:var(--ink); border-color:var(--ink); color:var(--card);}
  .legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:0.5px solid var(--line);}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
  .dot{width:9px; height:9px; border-radius:2px; display:inline-block; flex-shrink:0;}
  .empty{padding:48px 0; text-align:center; color:var(--ink-soft); font-size:14px;}
  .card-title{font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:12px; display:flex; align-items:center; gap:6px;}
  .bar-row{margin-bottom:10px;}
  .bar-row-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; gap:8px;}
  .bar-track{height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
  .bar-fill{height:100%;}
  .form-field{width:100%; font-family:'Be Vietnam Pro',sans-serif; font-size:13px; padding:8px 10px; border-radius:6px;
    border:1px solid var(--line); background:var(--paper); margin-bottom:10px;}
  .btn{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; font-family:'Be Vietnam Pro',sans-serif;
    font-size:13px; font-weight:600; padding:9px 0; border-radius:6px; border:none; background:var(--ink); color:var(--card); cursor:pointer;}
  .err{color:var(--red); font-size:12px; margin-bottom:8px;}
  .locked-note{font-size:12px; color:var(--ink-soft); text-align:center; padding:8px 0;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead tr{border-bottom:1px solid var(--ink);}
  th{text-align:left; padding:6px 10px; font-weight:500; color:var(--ink-soft);}
  th:first-child{border-left:3px solid var(--red); padding-left:10px;}
  td{padding:8px 10px; border-bottom:0.5px solid var(--line);}
  td:first-child{border-left:3px solid var(--red); padding-left:10px; font-family:'IBM Plex Mono',monospace;}
  tr:nth-child(even) td{background:var(--paper);}
  .amount{font-family:'IBM Plex Mono',monospace; text-align:right;}
  .del{background:none; border:none; cursor:pointer; color:var(--ink-soft);}
  .cat-cell{display:inline-flex; align-items:center; gap:6px;}
  .table-title{font-size:13px; font-weight:600; color:var(--ink-soft); padding:16px 20px 0;}
  .table-wrap{padding:12px 20px 20px;}
  canvas{max-height:300px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="authbar" id="authbar"></div>

  <div class="header">
    <div>
      <div class="kicker">📜 Sổ doanh số</div>
      <h1>Đầu Bếp Việt · PUFU · Hapinut · Việt Hỷ · Eco.Mi · ECOM</h1>
      <p class="sub">Theo dõi doanh số ngày, tuần, quý, năm cho từng brand — cập nhật trực tiếp trên mọi thiết bị.</p>
    </div>
    <div class="stamp">
      <span>Tổng cộng</span>
      <span id="stampTotal">0 đ</span>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <div id="chartEmpty" class="empty" style="display:none;">Chưa có dữ liệu.</div>
      <canvas id="chart"></canvas>
      <div class="legend" id="legend"></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:20px;">
      <div class="card">
        <div class="card-title">📦 Tỷ trọng theo brand</div>
        <div id="breakdown"></div>
      </div>
      <div class="card" id="entryCard">
        <div class="card-title">Thêm mục doanh số</div>
        <div id="entryForm"></div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:20px; padding:0;">
    <div class="table-title">Toàn bộ ghi chép</div>
    <div class="table-wrap" id="tableWrap"></div>
  </div>
</div>

<script>
/* ======================= CẤU HÌNH — ĐIỀN THÔNG TIN SUPABASE CỦA ANH VÀO ĐÂY ======================= */
const SUPABASE_URL = 'https://odzvclcfbagbijaslzmx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_E1xBbETlp7fsB0xQ6yj94A_U96iFqJv';
/* ==================================================================================================== */

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORIES = [
  { id: 'daubepviet', name: 'Gạo Đầu Bếp Việt', color: '#C99A3B' },
  { id: 'pufu',       name: 'Gạo PUFU',          color: '#D9B968' },
  { id: 'hapinut',    name: 'Hapinut',            color: '#7A5A38' },
  { id: 'viethy',     name: 'Việt Hỷ',            color: '#A63D2F' },
  { id: 'ecomi',      name: 'Eco.Mi',             color: '#56724F' },
  { id: 'ecom',       name: 'ECOM',               color: '#3E6B72' },
];
const PERIODS = [
  { id: 'day', label: 'Ngày' },
  { id: 'week', label: 'Tuần' },
  { id: 'quarter', label: 'Quý' },
  { id: 'year', label: 'Năm' },
];
const LAST_N = { day: 14, week: 12, quarter: 8, year: 6 };

let records = [];
let period = 'day';
let chart = null;
let session = null;

function formatVND(n){ return Math.round(n).toLocaleString('vi-VN') + ' đ'; }

function getISOWeek(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
  return { week: weekNo, year: date.getUTCFullYear() };
}

function periodInfo(dateStr, p){
  const d = new Date(dateStr + 'T00:00:00');
  const year = d.getFullYear();
  if (p === 'day') return { key: dateStr, label: d.toLocaleDateString('vi-VN') };
  if (p === 'week'){
    const { week, year: wy } = getISOWeek(d);
    return { key: `${wy}-W${String(week).padStart(2,'0')}`, label: `Tuần ${week}/${wy}` };
  }
  if (p === 'quarter'){
    const q = Math.floor(d.getMonth()/3)+1;
    return { key: `${year}-Q${q}`, label: `Quý ${q}/${year}` };
  }
  return { key: `${year}`, label: `${year}` };
}

/* ---------------- Dữ liệu: tải từ Supabase + lắng nghe real-time ---------------- */
async function loadRecords(){
  const { data, error } = await supabaseClient.from('sales_records').select('*').order('date', { ascending: false });
  if (!error) records = data;
  render();
}

supabaseClient
  .channel('sales_records_changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'sales_records' }, () => loadRecords())
  .subscribe();

/* ---------------- Đăng nhập admin ---------------- */
async function initAuth(){
  const { data } = await supabaseClient.auth.getSession();
  session = data.session;
  renderAuthbar();
}
supabaseClient.auth.onAuthStateChange((_event, s) => { session = s; renderAuthbar(); renderEntryForm(); });

function renderAuthbar(){
  const bar = document.getElementById('authbar');
  if (session){
    bar.innerHTML = `<span class="badge-live"><span class="dot-live"></span>Trực tiếp</span>
      <span>Đang đăng nhập: ${session.user.email}</span>
      <button class="ghost" id="logoutBtn">Đăng xuất</button>`;
    document.getElementById('logoutBtn').onclick = () => supabaseClient.auth.signOut();
  } else {
    bar.innerHTML = `<span class="badge-live"><span class="dot-live"></span>Trực tiếp</span>
      <input id="loginEmail" placeholder="Email admin" />
      <input id="loginPass" type="password" placeholder="Mật khẩu" />
      <button id="loginBtn">Đăng nhập</button>`;
    document.getElementById('loginBtn').onclick = async () => {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPass').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert('Sai email hoặc mật khẩu.');
    };
  }
}

/* ---------------- Form thêm mục (chỉ hiện khi đã đăng nhập) ---------------- */
function renderEntryForm(){
  const el = document.getElementById('entryForm');
  if (!session){
    el.innerHTML = `<div class="locked-note">Chỉ admin đăng nhập mới nhập được số liệu.<br>Người khác chỉ xem.</div>`;
    return;
  }
  el.innerHTML = `
    <input type="date" id="fDate" class="form-field" />
    <select id="fCategory" class="form-field">${CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>
    <input type="number" min="0" id="fRevenue" class="form-field" placeholder="Doanh số (đ)" />
    <div id="formErr" class="err" style="display:none;"></div>
    <button class="btn" id="addBtn">+ Thêm</button>
  `;
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('addBtn').onclick = async () => {
    const date = document.getElementById('fDate').value;
    const category = document.getElementById('fCategory').value;
    const revenue = Number(document.getElementById('fRevenue').value);
    const errEl = document.getElementById('formErr');
    if (!date){ errEl.textContent = 'Chọn ngày.'; errEl.style.display='block'; return; }
    if (!revenue || revenue <= 0){ errEl.textContent = 'Nhập doanh số hợp lệ.'; errEl.style.display='block'; return; }
    errEl.style.display = 'none';
    const { error } = await supabaseClient.from('sales_records').insert([{ date, category, revenue }]);
    if (error) { errEl.textContent = 'Lỗi lưu dữ liệu: ' + error.message; errEl.style.display='block'; return; }
    document.getElementById('fRevenue').value = '';
  };
}

async function removeRecord(id){
  if (!session) return;
  await supabaseClient.from('sales_records').delete().eq('id', id);
}

/* ---------------- Render biểu đồ / bảng ---------------- */
function initTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  PERIODS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (p.id === period ? ' active' : '');
    btn.textContent = p.label;
    btn.onclick = () => { period = p.id; render(); };
    tabs.appendChild(btn);
  });
}

function computeChartData(){
  const map = {};
  records.forEach(r => {
    const { key, label } = periodInfo(r.date, period);
    if (!map[key]){ map[key] = { key, label, total:0 }; CATEGORIES.forEach(c => map[key][c.id]=0); }
    map[key][r.category] += Number(r.revenue);
    map[key].total += Number(r.revenue);
  });
  return Object.values(map).sort((a,b)=> a.key > b.key ? 1 : -1).slice(-LAST_N[period]);
}

function renderChart(){
  const data = computeChartData();
  document.getElementById('chartEmpty').style.display = data.length ? 'none' : 'block';
  document.getElementById('chart').style.display = data.length ? 'block' : 'none';
  if (chart) chart.destroy();
  if (!data.length) return;
  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.map(d => d.label),
      datasets: CATEGORIES.map(c => ({
        label: c.name, data: data.map(d => d[c.id]), backgroundColor: c.color, stack: 'a',
      })),
    },
    options: {
      responsive: true,
      plugins: { legend: { display:false }, tooltip: {
        callbacks: { label: (ctx) => `${ctx.dataset.label}: ${formatVND(ctx.raw)}` }
      }},
      scales: {
        x: { stacked:true, grid:{display:false}, ticks:{font:{family:"'Be Vietnam Pro'", size:11}, color:'#5B6670'} },
        y: { stacked:true, grid:{color:'#D8CBAA'}, ticks:{font:{family:"'IBM Plex Mono'", size:11}, color:'#5B6670',
          callback: (v) => v >= 1000000 ? `${Math.round(v/1000000)}tr` : v } },
      },
    },
  });
}

function renderLegend(){
  document.getElementById('legend').innerHTML = CATEGORIES.map(c =>
    `<div class="legend-item"><span class="dot" style="background:${c.color}"></span>${c.name}</div>`
  ).join('');
}

function renderBreakdown(){
  const byCategory = {}; let all = 0;
  CATEGORIES.forEach(c => byCategory[c.id] = 0);
  records.forEach(r => { byCategory[r.category] += Number(r.revenue); all += Number(r.revenue); });
  document.getElementById('stampTotal').textContent = formatVND(all);
  document.getElementById('breakdown').innerHTML = CATEGORIES.map(c => {
    const val = byCategory[c.id];
    const pct = all > 0 ? (val/all)*100 : 0;
    return `<div class="bar-row">
      <div class="bar-row-top"><span>${c.name}</span><span style="font-family:'IBM Plex Mono',monospace;color:var(--ink-soft)">${formatVND(val)} · ${pct.toFixed(0)}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${c.color}"></div></div>
    </div>`;
  }).join('');
}

function renderTable(){
  const sorted = [...records].sort((a,b) => a.date < b.date ? 1 : -1);
  const wrap = document.getElementById('tableWrap');
  if (!sorted.length){ wrap.innerHTML = '<div style="color:var(--ink-soft); font-size:13px;">Chưa có mục nào.</div>'; return; }
  wrap.innerHTML = `<table>
    <thead><tr><th>Ngày</th><th>Brand</th><th style="text-align:right">Doanh số</th><th></th></tr></thead>
    <tbody>${sorted.map(r => {
      const cat = CATEGORIES.find(c => c.id === r.category) || { name: r.category, color: '#999' };
      return `<tr>
        <td>${new Date(r.date+'T00:00:00').toLocaleDateString('vi-VN')}</td>
        <td><span class="cat-cell"><span class="dot" style="background:${cat.color}"></span>${cat.name}</span></td>
        <td class="amount">${formatVND(r.revenue)}</td>
        <td style="text-align:center">${session ? `<button class="del" onclick="removeRecord(${r.id})">🗑</button>` : ''}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function render(){
  initTabs();
  renderChart();
  renderLegend();
  renderBreakdown();
  renderTable();
  renderEntryForm();
}

initAuth();
loadRecords();
</script>
</body>
</html>
